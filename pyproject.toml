[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", ".venv-*", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # Home Assistant requires call-time defaults in schemas
    "RUF001", # ambiguous unicode in strings
    "RUF002",
    "RUF003",
    "SIM108", # explicit if/else is clearer in places
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"tools/*" = ["BLE001"]  # the CLI intentionally reports one generic failure
